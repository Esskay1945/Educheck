name: EduCheck tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y antiword tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/educheck.js
      - run: gunicorn --check-config --preload app:app
